# Companies whose own career sites are read directly: the built-in list.
#
# Your own companies go into your companies.yml, not here (an update of
# job-radar replaces this file). Add one with its homepage or careers page and
# the radar works out the rest:
#   node radar.mjs discover "Name" https://company.example --add [--cz]
#   node radar.mjs discover --file companies.txt --add      (one "Name | URL | cz" per line)
# When a company cannot be read, the same command says why. To leave a built-in
# company out, name it under `skip:` in your companies.yml.
#
# Kinds of entry:
#   ats + slug     a hiring system's board (clean list, full texts).
#                  `ats: jobscz` is special: the company's own ads on Jobs.cz,
#                  for a site that is closed to automated readers.
#   url            the page that lists the jobs: the company's own careers page,
#                  or a job widget it embeds from another service.
#                  render: true      load it in a headless browser (pages built by JavaScript)
#                  link_pattern:     regular expression for job links, when the automatic pick misses
#                  location:         used for jobs whose card does not state a place
#   country: cz    a job without a stated place is taken to be in Czechia
#
# A company with no openings today stays in the list and is checked on every scan.
# The radar also adds companies by itself when a strong fit turns up on a board
# it can read; those are kept in state/companies-auto.json in your data folder.

companies:
