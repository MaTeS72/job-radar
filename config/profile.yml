# Search profile: what counts as a fit.
#
# These rules decide which jobs are shown. Sources only collect listings; every
# listing is then scored here on its title AND its full description, so
# "Software Engineer" with Flutter in the text is found, and "AI Engineer" that
# is really Python ML research is flagged.
#
# This is the built-in profile: senior Flutter / mobile, agentic / AI-native
# engineering and product roles, for someone living in Prague. To change it for
# yourself, write only the part you want different into your own profile.yml
# ("node radar.mjs init" creates it; the README explains how the two are
# combined). An update of job-radar replaces this file, never yours.
#
# Terms are matched on whole words, without diacritics or case. `*` means "any
# letters", which covers Czech endings ("mobiln* aplikac*").
# Hyphens and spaces are the same thing ("AI-native" = "AI native").

thresholds:
  strong: 65        # top section of the report; pushed to the career-ops inbox
  maybe: 50         # listed lower in the report, never pushed automatically
  detail: 22        # score a listing needs from its title alone before its page is opened

max_age_days: 45    # older postings are dropped when the source gives a date
                    # (not for company sites, StartupJobs and Cocuma: what they list is open)

